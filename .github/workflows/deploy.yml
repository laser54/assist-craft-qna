name: Validate deployment configuration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coolify Compose
        run: docker compose -f docker-compose.coolify.yml config --quiet

# Deployment is owned exclusively by Coolify's GitHub App.
# There is no SSH deployment or image publication from GitHub Actions.
